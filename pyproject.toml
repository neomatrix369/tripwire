[project]
name = "tripwire"
version = "0.1.0"
description = "AI skill / MCP server security scanning platform"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-testmon>=2.1.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "pip-audit>=2.7.0",
    "bandit>=1.7.8",
    "radon>=6.0.0",
    "xenon>=0.9.0",
    "vulture>=2.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sandbox", "guard"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "fixtures",
    "prototypes",
    "internal-docs",
    "cli/node_modules",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
# Long lines + compact chaining in scanner adapters (bootstrap; tighten later).
ignore = ["E501", "E702"]

[tool.pytest.ini_options]
pythonpath = ["sandbox"]
testpaths = ["sandbox"]
python_files = ["test_*.py"]
addopts = "-v --tb=short --junitxml=.test-results/junit.xml"

[tool.coverage.run]
branch = true
# Ship-path Python bar (slice 11): sandbox only — guard/ is Phase 4 / out of bar.
source = ["sandbox"]
omit = [
    "sandbox/test_*.py",
    "sandbox/conftest.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
show_missing = true
# Ship-path sandbox ≥95% (slice 11). guard/ omitted from denominator.
fail_under = 95
precision = 1

[tool.coverage.html]
directory = ".reports/coverage/html"

[tool.coverage.xml]
output = ".reports/coverage/coverage.xml"

[tool.coverage.json]
output = ".reports/coverage/coverage.json"

[tool.bandit]
exclude_dirs = ["tests", ".venv", "fixtures", "prototypes", "cli", "internal-docs"]
# B101: assert used in tests / guards
# B108: Modal sandbox uses fixed /tmp/scan-target (ephemeral container FS)
# B404/B603: subprocess needed for scanner CLI adapters (sandbox/scanners.py)
skips = ["B101", "B108", "B404", "B603"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "fixtures/",
    "prototypes/",
    "internal-docs/",
    "cli/",
    "sandbox/test_.*\\.py",
]

[tool.xenon]
# Bootstrap ceilings — run_snyk is D (CC≈24). Tighten toward C/B/A as adapters simplify.
# Grade scale: A=best(<=5), B(<=10), C(<=15), D/E/F=too complex.
max-absolute = "D"
max-modules = "B"
max-average = "A"

[tool.vulture]
min_confidence = 80
exclude = ["fixtures/", "prototypes/", "internal-docs/", "cli/", ".venv/"]
