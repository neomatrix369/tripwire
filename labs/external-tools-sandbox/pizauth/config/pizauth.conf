// Lab minimal config for [ltratt/pizauth](https://github.com/ltratt/pizauth/).
// OAuth client_id / client_secret are PLACEHOLDERS — real tokens need HITL
// (register an app with your IdP; never commit real secrets).

http_listen = "0.0.0.0:14204";
https_listen = none;

// Log auth URLs / errors to stderr (visible with `pizauth server -d`).
auth_notify_cmd = "echo \"[pizauth] auth needed for $PIZAUTH_ACCOUNT: $PIZAUTH_URL\" >&2";
error_notify_cmd = "echo \"[pizauth] error for $PIZAUTH_ACCOUNT: $PIZAUTH_MSG\" >&2";

account "lab" {
    auth_uri = "https://login.microsoftonline.com/common/oauth2/v2.0/authorize";
    token_uri = "https://login.microsoftonline.com/common/oauth2/v2.0/token";
    // HITL: replace with a real Client ID from your OAuth app registration.
    client_id = "lab-placeholder-client-id";
    // HITL: replace with a real Client secret (or omit if the IdP allows public clients).
    client_secret = "lab-placeholder-client-secret";
    scopes = [
        "https://outlook.office365.com/IMAP.AccessAsUser.All",
        "https://outlook.office365.com/SMTP.Send",
        "offline_access"
    ];
    auth_uri_fields = { "login_hint": "lab@example.com" };
}
