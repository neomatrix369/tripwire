# Maturity: Serious — full project-hygiene for Tripwire (mixed Python + Node cli/).
# Principle: one tool per concern; commit stage stays fast; coverage at push.
#
# Stages:
#   pre-commit: hygiene, secrets, bandit, ruff, mypy, pytest-testmon, cli tests
#   pre-push:   full pytest+coverage, conditional pip-audit / npm audit
#
# Parallel: pre-commit run -j 4 --all-files
# Full gates: ./scripts/quality-gates.sh
# Full + security-scan: ./scripts/quality-gates.sh --full

default_stages: [pre-commit]

repos:
  # ── Hygiene ──────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^fixtures/
      - id: end-of-file-fixer
        exclude: ^fixtures/
      - id: check-yaml
      - id: check-toml
      - id: check-json
        exclude: ^fixtures/
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: detect-private-key
        exclude: ^fixtures/
      - id: debug-statements
        exclude: ^fixtures/

  # ── Shell, GitHub Actions, Markdown ─────────────────────
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        files: ^scripts/.*\.sh$

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.43.0
    hooks:
      - id: markdownlint
        args: [--config, .markdownlint.json]
        files: \.md$
        exclude: |
          (?x)^(
            fixtures/|
            prototypes/|
            internal-docs/|
            \.claude/|
            \.cursor/
          )

  # ── Secrets ──────────────────────────────────────────────
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.22.1
    hooks:
      - id: gitleaks
        args: [--config, .gitleaks.toml]

  # ── Python SAST ──────────────────────────────────────────
  - repo: local
    hooks:
      - id: bandit
        name: bandit SAST (medium+)
        entry: uv run bandit -c pyproject.toml -r sandbox guard scripts -q -ll
        language: system
        pass_filenames: false
        types: [python]
        exclude: ^fixtures/

  # ── Python lint + format ─────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        exclude: ^fixtures/
      - id: ruff-format
        exclude: ^fixtures/

  # ── Python type check ─────────────────────────────────────
  - repo: local
    hooks:
      - id: mypy
        name: mypy type check
        entry: uv run mypy sandbox/ guard/
        language: system
        pass_filenames: false
        types: [python]
        exclude: ^fixtures/

  # ── Python complexity + dead code (fast; CI-only previously) ─
  - repo: local
    hooks:
      - id: xenon
        name: xenon complexity (max D absolute — matches CI)
        entry: uv run xenon --max-absolute D --max-modules B --max-average A sandbox/scan_app.py sandbox/scanners.py sandbox/__init__.py guard
        language: system
        pass_filenames: false
        types: [python]
        exclude: ^fixtures/
      - id: vulture
        name: vulture dead code (≥80% confidence)
        entry: uv run vulture sandbox/scan_app.py sandbox/scanners.py sandbox/__init__.py guard --min-confidence 80
        language: system
        pass_filenames: false
        types: [python]
        exclude: ^fixtures/

  # ── Commit: fast Python tests (testmon incremental) ───────
  - repo: local
    hooks:
      - id: fast-tests
        name: fast unit tests (pytest-testmon)
        entry: uv run pytest sandbox/tests/ -x -q --tb=short --no-header --testmon -o addopts=
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-commit]

  # ── Commit: CLI unit tests ────────────────────────────────
  - repo: local
    hooks:
      - id: cli-fast-tests
        name: CLI unit tests (node --test)
        entry: bash -c 'cd cli && npm test'
        language: system
        pass_filenames: false
        files: ^cli/
        stages: [pre-commit]

  # ── Pre-push: push-specific gates only ───────────────────
  - repo: local
    hooks:
      - id: pre-push-gates
        name: pre-push gates (coverage, conditional audits)
        entry: bash scripts/pre-push-gates.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
