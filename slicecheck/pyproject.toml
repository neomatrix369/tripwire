[project]
name = "slicecheck"
version = "0.1.0"
description = "Automatic pull-request verification for Cloudflare Workers"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx>=0.27.0,<1.0",
]

[dependency-groups]
dev = [
    "bandit>=1.7.8,<2.0",
    "mypy>=1.8.0,<2.0",
    "pytest>=8.0.0,<10.0",
    "pytest-asyncio>=0.23.0,<2.0",
    "ruff>=0.2.0,<1.0",
    "uv>=0.12.3,<0.13.0",
    "workers-py>=1.17.1,<2.0",
    "workers-runtime-sdk>=1.8.2,<2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
pythonpath = [".."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]
