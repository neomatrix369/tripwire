name: Mutation

# =============================================================================
# C — Mutation
# =============================================================================
# Cadence:   twice monthly 1st + 15th 04:00 UTC  |  cron: "0 4 1,15 * *"
#            + workflow_dispatch
# Jobs:      Stryker (CLI) · advisory mutmut (Python; || true / under-running)
# Purpose:   deep mutation signal; expensive (Stryker ~45 min dominates billable).
# Gating:    NON-GATING — green ≠ high mutation score (ADR-0013; break: 0).
#
# Sibling T4 cadences:
#   A — nightly.yml        daily 02:00 UTC     |  Light T4
#   B — supply-chain.yml   weekly Mon 03:00 UTC |  SBOM · Meterian · Chalk
# Canonical docs: CONTRIBUTING.md · docs/README.md § CI workflows · ADR-0013

on:
  schedule:
    - cron: "0 4 1,15 * *" # C: 1st+15th 04:00 UTC — mutation
  workflow_dispatch:

jobs:
  mutation-tests-python:
    name: Mutation testing — Python (mutmut)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv pip install --system -e ".[dev]" mutmut
      - name: Run mutation tests
        run: |
          mutmut run --paths-to-mutate sandbox/,guard/ || true
          mutmut results || true
          mutmut junitxml > mutation-results-python.xml || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-python-${{ github.run_number }}
          path: mutation-results-python.xml
          retention-days: 30
          if-no-files-found: warn

  mutation-tests-cli:
    name: Mutation testing — CLI (Stryker)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci
        working-directory: cli
      - name: Install Stryker (CI-only, no lockfile change)
        run: npm install --no-save @stryker-mutator/core@^8
        working-directory: cli
      - name: Seed Stryker sandbox base with project-root fixtures
        # Tests in cli/test/ navigate ../../db/ and ../fixtures/ which resolves
        # to cli/.stryker-tmp/{db,fixtures} inside Stryker's sandbox. Pre-copy
        # them so the dry-run passes without || true suppression.
        run: |
          mkdir -p cli/.stryker-tmp
          cp -r db cli/.stryker-tmp/db
          cp -r fixtures cli/.stryker-tmp/fixtures
      - name: Run mutation tests
        run: npx stryker run
        working-directory: cli
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-cli-${{ github.run_number }}
          path: cli/reports/mutation/
          retention-days: 30
          if-no-files-found: warn
