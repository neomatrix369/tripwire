name: Supply chain

# B — Supply chain: external SCA / SBOM / provenance (drifts slowly).
# Schedule: weekly Monday 03:00 UTC (+ workflow_dispatch).
# Sibling cadences: Nightly = A Light T4 (daily); Mutation = C (1st+15th).

on:
  schedule:
    - cron: "0 3 * * 1" # Monday 03:00 UTC
  workflow_dispatch:

jobs:
  sbom:
    name: SBOM + license compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: anchore/sbom-action@v0.24.2
        with:
          format: cyclonedx-json
          output-file: sbom.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sbom-${{ github.run_number }}
          path: sbom.json
          retention-days: 90
          if-no-files-found: warn
      - name: License compliance (trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          exit-code: "1"
          format: table
          scanners: license
          severity: HIGH,CRITICAL
          skip-dirs: fixtures,prototypes,internal-docs,cli/node_modules

  meterian:
    name: Meterian SCA + license (strict)
    runs-on: ubuntu-latest
    env:
      METERIAN_API_TOKEN: ${{ secrets.METERIAN_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Meterian SCA + license
        if: env.METERIAN_API_TOKEN != ''
        uses: MeterianHQ/meterian-github-action@v1.0.18
        with:
          cli_args: --min-security=95 --min-licensing=95
      - name: Meterian skipped (no token)
        if: env.METERIAN_API_TOKEN == ''
        run: echo "METERIAN_API_TOKEN not set — skipping Meterian"

  chalk:
    name: Chalk (source provenance)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up Chalk
        uses: crashappsec/setup-chalk-action@v0.0.3
      - name: Chalk mark source artifacts
        # continue-on-error keeps the job green while making failures visible
        # as a yellow ⚠ in the Actions UI — unlike || true which hides them
        continue-on-error: true
        run: chalk insert sandbox/ guard/ scripts/ cli/
      - name: Upload Chalk report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chalk-report-${{ github.run_number }}
          path: ~/.local/chalk/chalk.log
          retention-days: 90
          if-no-files-found: warn
