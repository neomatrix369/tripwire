name: CI

# Serious-tier T1–T3 for Tripwire (Python sandbox + Node cli/).
# Ship-path coverage: Python sandbox fail_under=95; CLI c8 ≥95% lines.
# Fixtures/prototypes excluded from secrets/FS scans (dashboard tests gated separately).
#
# Status badge: README + docs/README.md (CI).
# Primary stack (docs): Cursor · Modal · Supabase · Tripwire
# Scanners (docs): Cisco Skill/MCP · Snyk · Tessl

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1" # Monday 03:00 UTC — re-run T3 on main
  workflow_dispatch:

jobs:
  repo-lint:
    name: Repo lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv pip install --system -e ".[dev]"
      - run: pre-commit run shellcheck --all-files
      - run: pre-commit run actionlint --all-files
      - run: pre-commit run markdownlint --all-files

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv pip install --system -e ".[dev]"
      - uses: actions/cache@v6
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
      - run: ruff check sandbox guard scripts
      - run: ruff format --check sandbox guard scripts
      - run: mypy sandbox/ guard/
      - run: bandit -c pyproject.toml -r sandbox guard scripts -q -ll
      - run: bash scripts/complexity-report.sh
      - name: Xenon complexity (scan_app — max C)
        run: >
          xenon --max-absolute C --max-modules B --max-average A
          sandbox/scan_app.py sandbox/__init__.py
      - name: Xenon complexity (scanners.py — bootstrap D; run_snyk tracked for refactor)
        run: >
          xenon --max-absolute D --max-modules C --max-average B
          sandbox/scanners.py
      - run: >
          vulture sandbox/scan_app.py sandbox/scanners.py sandbox/__init__.py guard
          --min-confidence 80
      - run: uv run pylint --disable=all --enable=duplicate-code sandbox/ guard/

  backend-sandbox-tests:
    name: Backend — sandbox tests + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare test artifacts
        run: |
          mkdir -p .test-results .reports/coverage
          echo "Initialized before dependency installation so early failures retain diagnostics." > .test-results/run-context.txt
          echo "Initialized before dependency installation so early failures retain diagnostics." > .reports/coverage/run-context.txt
      - uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv pip install --system -e ".[dev]"
      - run: |
          pytest sandbox/tests/ -q --tb=short \
            --cov=sandbox \
            --cov-report=term-missing \
            --cov-report=html:.reports/coverage/html \
            --cov-report=xml:.reports/coverage/coverage.xml \
            --cov-report=json:.reports/coverage/coverage.json \
            --cov-fail-under=95 \
            --junitxml=.test-results/junit.xml \
            -o addopts=
      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-backend-sandbox-${{ github.run_number }}
          path: .test-results/
          retention-days: 14
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-backend-sandbox-${{ github.run_number }}
          path: .reports/coverage/
          retention-days: 14
      - run: pip-audit --skip-editable

  frontend-cli-tests:
    name: Frontend — CLI tests + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare test artifacts
        working-directory: cli
        run: |
          mkdir -p .test-results .reports/coverage
          echo "Initialized before dependency installation so early failures retain diagnostics." > .test-results/run-context.txt
          echo "Initialized before dependency installation so early failures retain diagnostics." > .reports/coverage/run-context.txt
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci
        working-directory: cli
      - run: npm run lint
        working-directory: cli
      - name: Run tests with coverage
        run: |
          set -o pipefail
          npm run test:coverage 2>&1 | tee .test-results/tap.txt
        working-directory: cli
      - run: npm audit --audit-level=high
        working-directory: cli
      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-frontend-cli-${{ github.run_number }}
          path: cli/.test-results/
          retention-days: 14
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-frontend-cli-${{ github.run_number }}
          path: cli/.reports/coverage/
          retention-days: 14

  dashboard-tests:
    name: Prototype dashboard tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: prototypes/dc-dashboard/package-lock.json
      - run: npm ci
        working-directory: prototypes/dc-dashboard
      - run: npm run lint
        working-directory: prototypes/dc-dashboard
      - run: npm test
        working-directory: prototypes/dc-dashboard

  secrets:
    name: Secrets scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  sast:
    name: SAST — Semgrep + OSV-Scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Semgrep SAST
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/owasp-top-ten
            p/python
            p/secrets
      - name: OSV-Scanner (SCA)
        uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
        with:
          # Exclude intentional vuln fixtures / prototypes (parity with Trivy skip-dirs).
          # Fixture-local osv-scanner.toml also ignores vuln-dependency-lodash.
          scan-args: |-
            --recursive
            --experimental-exclude=fixtures
            --experimental-exclude=prototypes
            --experimental-exclude=internal-docs
            .

  meterian:
    name: Meterian SCA + license
    runs-on: ubuntu-latest
    env:
      METERIAN_API_TOKEN: ${{ secrets.METERIAN_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Meterian SCA + license
        if: env.METERIAN_API_TOKEN != ''
        uses: MeterianHQ/meterian-github-action@v1.0.18
        with:
          cli_args: --min-security=90 --min-licensing=80
      - name: Meterian skipped (no token)
        if: env.METERIAN_API_TOKEN == ''
        run: echo "METERIAN_API_TOKEN not set — skipping Meterian"

  codeql:
    name: CodeQL (deep SAST)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      matrix:
        language: [python, javascript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4

  trivy:
    name: Trivy (filesystem)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          exit-code: "1"
          severity: HIGH,CRITICAL
          format: table
          skip-dirs: fixtures,prototypes,internal-docs,cli/node_modules
          skip-files: .env,.env.local

  trufflehog:
    name: TruffleHog (incremental)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@v3.96.0
        with:
          extra_args: --only-verified --exclude-paths=.trufflehog-exclude
