name: Complexity report

on:
  pull_request:
    branches: [main]
    paths:
      - 'sandbox/**/*.py'
      - 'cli/**/*.js'
      - 'scripts/complexity-report.sh'
      - 'scripts/write_complexity_summary.py'
      - 'cli/eslint.complexity.config.js'
      - 'cli/package.json'
      - 'cli/package-lock.json'

permissions:
  contents: read
  pull-requests: write

jobs:
  report:
    name: Complexity evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: '.python-version'
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: uv sync --extra dev
      - run: npm ci
        working-directory: cli
      - run: bash scripts/complexity-report.sh
      - uses: actions/upload-artifact@v7
        with:
          name: complexity-${{ github.run_number }}
          path: .reports/complexity/
          retention-days: 14
      - id: body
        name: Read PR-body section
        run: |
          {
            echo 'markdown<<EOF'
            cat .reports/complexity/pr-body.md
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Update PR complexity section
        if: github.event.pull_request.head.repo.fork == false
        uses: actions/github-script@v7
        env:
          COMPLEXITY_MARKDOWN: ${{ steps.body.outputs.markdown }}
        with:
          script: |
            const marker = /<!-- tripwire-complexity:start -->[\s\S]*?<!-- tripwire-complexity:end -->/;
            const replacement = process.env.COMPLEXITY_MARKDOWN;
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            const currentBody = pullRequest.body || '';
            const body = marker.test(currentBody)
              ? currentBody.replace(marker, replacement)
              : `${currentBody.trimEnd()}\n\n${replacement}`.trimStart();
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              body,
            });
