name: Nightly

# T4 slow/deep checks — Tripwire (Python: mutmut; CLI: Stryker command runner; no Dockerfile yet).
#
# Status badge: README + docs/README.md (Nightly).
# Primary stack (docs): Cursor · Modal · Supabase · Tripwire
# Scanners (docs): Cisco Skill/MCP · Snyk · Tessl

on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC every night
  workflow_dispatch:

jobs:
  nightly-tests-python:
    name: Backend — sandbox tests + coverage (nightly snapshot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare test artifact directories
        run: |
          mkdir -p .test-results .reports/coverage
          echo "This directory is initialized before dependency installation so upload diagnostics survive early job failures." > .test-results/run-context.txt
          echo "This directory is initialized before dependency installation so upload diagnostics survive early job failures." > .reports/coverage/run-context.txt
      - uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv pip install --system -e ".[dev]"
      - run: |
          pytest sandbox/tests/ -q --tb=short \
            --cov=sandbox \
            --cov-report=term-missing \
            --cov-report=html:.reports/coverage/html \
            --cov-report=xml:.reports/coverage/coverage.xml \
            --cov-report=json:.reports/coverage/coverage.json \
            --cov-fail-under=95 \
            --junitxml=.test-results/junit.xml \
            -o addopts=
      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nightly-test-results-backend-sandbox-${{ github.run_number }}
          path: .test-results/
          retention-days: 30
          if-no-files-found: warn
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nightly-coverage-backend-sandbox-${{ github.run_number }}
          path: .reports/coverage/
          retention-days: 30
          if-no-files-found: warn

  nightly-tests-node:
    name: Frontend — CLI tests + coverage (nightly snapshot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare test artifact directories
        working-directory: cli
        run: |
          mkdir -p .test-results .reports/coverage
          echo "This directory is initialized before dependency installation so upload diagnostics survive early job failures." > .test-results/run-context.txt
          echo "This directory is initialized before dependency installation so upload diagnostics survive early job failures." > .reports/coverage/run-context.txt
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci
        working-directory: cli
      - name: Run CLI tests with coverage
        working-directory: cli
        run: |
          set -o pipefail
          npm run test:coverage 2>&1 | tee .test-results/tap.txt
      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nightly-test-results-frontend-cli-${{ github.run_number }}
          path: cli/.test-results/
          retention-days: 30
          if-no-files-found: warn
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nightly-coverage-frontend-cli-${{ github.run_number }}
          path: cli/.reports/coverage/
          retention-days: 30
          if-no-files-found: warn

  nightly-complexity:
    name: Complexity report (nightly snapshot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: uv sync --extra dev
      - run: npm ci
        working-directory: cli
      - run: bash scripts/complexity-report.sh
      - name: Upload complexity report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nightly-complexity-${{ github.run_number }}
          path: .reports/complexity/
          retention-days: 30
          if-no-files-found: warn

  mutation-tests-python:
    name: Mutation testing — Python (mutmut)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv pip install --system -e ".[dev]" mutmut
      - name: Run mutation tests
        run: |
          mutmut run --paths-to-mutate sandbox/,guard/ || true
          mutmut results || true
          mutmut junitxml > mutation-results-python.xml || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-python-${{ github.run_number }}
          path: mutation-results-python.xml
          retention-days: 30
          if-no-files-found: warn

  mutation-tests-cli:
    name: Mutation testing — CLI (Stryker)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci
        working-directory: cli
      - name: Install Stryker (CI-only, no lockfile change)
        run: npm install --no-save @stryker-mutator/core@^8
        working-directory: cli
      - name: Seed Stryker sandbox base with project-root fixtures
        # Tests in cli/test/ navigate ../../db/ and ../fixtures/ which resolves
        # to cli/.stryker-tmp/{db,fixtures} inside Stryker's sandbox. Pre-copy
        # them so the dry-run passes without || true suppression.
        run: |
          mkdir -p cli/.stryker-tmp
          cp -r db cli/.stryker-tmp/db
          cp -r fixtures cli/.stryker-tmp/fixtures
      - name: Run mutation tests
        run: npx stryker run
        working-directory: cli
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-cli-${{ github.run_number }}
          path: cli/reports/mutation/
          retention-days: 30
          if-no-files-found: warn

  trufflehog-full:
    name: TruffleHog (full git history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@v3.97.1
        with:
          path: ./
          base: ""
          extra_args: --only-verified --exclude-paths=.trufflehog-exclude

  sbom:
    name: SBOM + license compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: anchore/sbom-action@v0.24.0
        with:
          format: cyclonedx-json
          output-file: sbom.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sbom-${{ github.run_number }}
          path: sbom.json
          retention-days: 90
          if-no-files-found: warn
      - name: License compliance (trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          exit-code: "1"
          format: table
          scanners: license
          severity: HIGH,CRITICAL
          skip-dirs: fixtures,prototypes,internal-docs,cli/node_modules

  meterian:
    name: Meterian SCA + license (nightly)
    runs-on: ubuntu-latest
    env:
      METERIAN_API_TOKEN: ${{ secrets.METERIAN_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Meterian SCA + license
        if: env.METERIAN_API_TOKEN != ''
        uses: MeterianHQ/meterian-github-action@v1.0.17
        with:
          cli_args: --min-security=95 --min-licensing=95
      - name: Meterian skipped (no token)
        if: env.METERIAN_API_TOKEN == ''
        run: echo "METERIAN_API_TOKEN not set — skipping Meterian"

  chalk:
    name: Chalk (source provenance)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up Chalk
        uses: crashappsec/setup-chalk-action@v0.0.3
      - name: Chalk mark source artifacts
        # continue-on-error keeps the job green while making failures visible
        # as a yellow ⚠ in the Actions UI — unlike || true which hides them
        continue-on-error: true
        run: chalk insert sandbox/ guard/ scripts/ cli/
      - name: Upload Chalk report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chalk-report-${{ github.run_number }}
          path: ~/.local/chalk/chalk.log
          retention-days: 90
          if-no-files-found: warn

  dependency-audit:
    name: Dependency audit (full lockfile sweep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv pip install --system -e ".[dev]"
      - run: pip-audit --skip-editable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci
        working-directory: cli
      - run: npm audit --audit-level=high
        working-directory: cli
