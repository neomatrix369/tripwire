version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      python-dev-tools:
        patterns: ["ruff", "mypy", "pre-commit", "pip-audit", "bandit"]

  - package-ecosystem: npm
    directory: "/cli"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
